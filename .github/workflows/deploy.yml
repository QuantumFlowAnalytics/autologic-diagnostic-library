name: Deploy AutoLogic PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip and python3
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3

      - name: Inspect archive contents
        run: |
          echo "=== Archive contents ==="
          unzip -l AutoLogic_PWA_MVP_0.4.0_OBDeX_9533_DTC.zip

      - name: Extract ZIP to temporary directory
        run: |
          mkdir -p /tmp/extract
          unzip AutoLogic_PWA_MVP_0.4.0_OBDeX_9533_DTC.zip -d /tmp/extract
          echo "=== Extracted files ==="
          find /tmp/extract -type f

      - name: Handle possible enclosing folder
        run: |
          INDEX_PATH=$(find /tmp/extract -name "index.html" | head -1)
          if [ -n "$INDEX_PATH" ]; then
            SOURCE_DIR=$(dirname "$INDEX_PATH")
            echo "Found index.html in: $SOURCE_DIR"
            rm -rf /tmp/deploy
            cp -r "$SOURCE_DIR" /tmp/deploy
          else
            echo "ERROR: index.html not found in archive"
            exit 1
          fi
          echo "=== Deploy directory ==="
          find /tmp/deploy -type f

      - name: Verify JSON parses and has 9533 records
        run: |
          JSON_FILE=$(find /tmp/deploy -name "generic.min.json" | head -1)
          if [ -z "$JSON_FILE" ]; then
            echo "ERROR: generic.min.json not found"
            exit 1
          fi
          python3 -c "
import json, sys
with open(sys.argv[1], 'r') as f:
    data = json.load(f)
count = len(data) if isinstance(data, (dict, list)) else 0
print(f'JSON record count: {count}')
assert count == 9533, f'Expected 9533 records, got {count}'
print('JSON validation passed: 9533 records')
" "$JSON_FILE"

      - name: Verify required files exist
        run: |
          FILES="index.html app.js manifest.webmanifest icon.svg sw.js README_UK.txt data/generic.min.json"
          for file in $FILES; do
            if [ -f "/tmp/deploy/$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
              exit 1
            fi
          done

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
